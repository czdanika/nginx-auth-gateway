resolver 127.0.0.11 valid=10s;  # Docker internal DNS

server {
    listen 80;

    # Auth service endpoints – no auth check on these
    location /auth/ {
        proxy_pass http://auth:5000;
        proxy_set_header Host $host;
    }

    location /login {
        proxy_pass http://auth:5000;
        proxy_set_header Host $host;
    }

    # Everything else – auth check, then route to per-user backend
    location / {
        auth_request      /auth/verify;
        auth_request_set  $auth_backend $upstream_http_x_auth_backend;
        error_page 401 = @login_redirect;

        set $backend $auth_backend;
        proxy_pass        http://$backend;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        return 302 /login;
    }
}
