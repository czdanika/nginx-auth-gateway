<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Statisztikák</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Ubuntu, sans-serif;
            background: #111;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1623410877102-1cb3d4c2f6ac?w=1920&q=85');
            background-size: cover;
            background-position: center;
            filter: brightness(0.55);
            transform: scale(1.05);
        }

        .card {
            position: relative;
            z-index: 10;
            width: 360px;
            padding: 44px 40px 40px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #fff;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 32px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px 13px 42px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color .2s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder { color: rgba(255,255,255,0.3); }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #FC4C02;
            background: rgba(255,255,255,0.11);
        }

        .error-msg {
            font-size: 13px;
            color: #ff6b6b;
            margin-bottom: 14px;
            display: {% if error %}block{% else %}none{% endif %};
        }

        button {
            width: 100%;
            padding: 13px;
            background: #FC4C02;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            letter-spacing: 0.2px;
        }

        button:hover { background: #e04400; }
        button:active { transform: scale(0.98); }

        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="card">
        <!-- Strava logo SVG -->
        <svg class="logo" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="30" fill="#FC4C02"/>
            <path d="M25.5 41L19 29h6.5l6 12zm5.5 0l-4-8h4l4 8h-4zm0 0l4-8 4 8" fill="none"/>
            <path d="M21 36l9-18 9 18h-5.5l-3.5-7-3.5 7H21z" fill="white"/>
        </svg>

        <h1>Strava Statisztikák</h1>
        <p class="subtitle">Kérjük, add meg a jelszót a belépéshez</p>

        <form method="POST" action="/login">
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" name="username" placeholder="Felhasználónév" autofocus autocomplete="username">
            </div>
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" name="password" placeholder="Jelszó" autocomplete="current-password">
            </div>

            <p class="error-msg">Hibás jelszó. Próbáld újra.</p>

            <button type="submit">Belépés</button>
        </form>

        <p class="footer">Statistics for Strava</p>
    </div>
</body>
</html>
